name: Build NocturneTXT APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-Extract Uploaded ZIP & Sync Nested Folders
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Found uploaded ZIP archive at repo root: $z — extracting..."
            unzip -o "$z" -d _extracted_zip
            if [ -d "_extracted_zip/nocturnetxt/app" ]; then
              cp -rf _extracted_zip/nocturnetxt/* .
              cp -rf _extracted_zip/nocturnetxt/.github . 2>/dev/null || true
            elif [ -d "_extracted_zip/app" ]; then
              cp -rf _extracted_zip/* .
              cp -rf _extracted_zip/.github . 2>/dev/null || true
            else
              sub=$(find _extracted_zip -maxdepth 2 -name "settings.gradle.kts" | head -n 1)
              if [ -n "$sub" ]; then
                subdir=$(dirname "$sub")
                cp -rf "$subdir"/* .
                cp -rf "$subdir"/.github . 2>/dev/null || true
              fi
            fi
            rm -rf _extracted_zip "$z"
          done

          for d in nocturnetxt*/ plaintext-audible-tracker*/; do
            if [ -d "${d}app" ]; then
              echo "Found nested folder $d — syncing to root..."
              cp -rf "$d"* .
              cp -rf "${d}.github" . 2>/dev/null || true
              rm -rf "$d"
            fi
          done

          echo "=== Verifying TrackerScreen.kt & build.gradle.kts ==="
          grep -E "versionCode|versionName" app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle (Clean Build Without Stale Cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Clean & Build Optimized Release & Debug APK
        run: gradle clean assembleRelease assembleDebug --no-daemon --no-build-cache

