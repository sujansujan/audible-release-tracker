name: Build NocturneTXT APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize Nested Folder Layout (If Uploaded Inside Subfolder)
        run: |
          if [ -d "nocturnetxt/app" ]; then
            echo "Found nested nocturnetxt/ folder; syncing newer files to root..."
            cp -rf nocturnetxt/* .
            rm -rf nocturnetxt
          fi
          echo "Building version from app/build.gradle.kts:"
          grep -E "versionCode|versionName" app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle (Clean Build Without Stale Cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Clean & Build Optimized Release & Debug APK
        run: gradle clean assembleRelease assembleDebug --no-daemon --no-build-cache

      - name: Rename APKs With Explicit Version Tag
        run: |
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/nocturnetxt-v2.1-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/nocturnetxt-v2.1-debug.apk

      - name: Upload Optimized v2.1 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nocturnetxt-v2.1-apk-${{ github.run_number }}
          overwrite: true
          path: |
            app/build/outputs/apk/release/nocturnetxt-v2.1-release.apk
            app/build/outputs/apk/debug/nocturnetxt-v2.1-debug.apk
